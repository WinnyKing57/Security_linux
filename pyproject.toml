[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-linux"
version = "0.1.0"
description = "Verrouillage automatique d'écran (webcam + bluetooth + localisation) et intégration Howdy - 100% local"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
security-linux = "security_linux.cli:main"
security-linuxd = "security_linux.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_linux = []